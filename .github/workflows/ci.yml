name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (bench)
        run: cargo clippy --all-targets --features bench -- -D warnings

      - name: Restore embedding model
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-Xenova-bge-small-en-v1.5-v1

      - name: Test
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: cargo test

      - name: Save embedding model
        if: always() && steps.hf-cache.outputs.cache-hit != 'true' && hashFiles('.hf-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-Xenova-bge-small-en-v1.5-v1

      - name: E9 check
        run: cargo run --example e9_provenance_ablation -- check

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Developer Certificate of Origin
        env:
          DCO_BASE_REF: ${{ github.base_ref }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh
